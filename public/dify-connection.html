<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dify 第二回复路线</title>
<style>body{font:16px/1.6 system-ui;margin:0;background:#f4f6fa;color:#17243a}main{max-width:880px;margin:36px auto;padding:24px;background:white;border-radius:16px}h1{font-size:26px}label{display:block;margin:14px 0 4px}input,select,button{font:inherit;padding:9px 12px;border:1px solid #bdc9d8;border-radius:7px}button{cursor:pointer;background:#174fcb;color:white}input{box-sizing:border-box;width:100%}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#58677c}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6fa;padding:14px;border-radius:8px}.bubble{padding:12px 16px;border-radius:9px;margin:10px 0;background:#eef3fb}.user{background:#e3f1e9}.error{color:#a12020}a{color:#174fcb}#chat{max-height:500px;overflow:auto}button:disabled{opacity:.5}</style>
<main><a href="/">← 返回招聘系统</a><h1>Dify 第二回复路线</h1><p class="muted">客户端继续负责企微收发；这里选择谁生成回复。下方模拟聊天只调用模型，不会向企微发送，也不会正式登记面试。</p>
<p id="notice"></p><label for="device">选择设备</label><select id="device"><option value="">正在加载…</option></select>
<div class="row"><label for="provider">回复来源</label><select id="provider"><option value="agent">系统 Agent</option><option value="dify">Dify 工作流</option></select><button id="save">保存该设备来源</button><button id="inspect">查看当前岗位输入</button></div>
<label><input type="checkbox" id="fresh" style="width:auto"> 我已核对专用客户端使用独立、无旧流程快照的状态目录（仅换设备码不够）</label><p id="state" class="muted"></p><pre id="facts" hidden></pre><hr><h2>隔离模拟对话</h2><p class="muted">仅在所选设备配置为 Dify 时使用。切换到真实设备前，请先在专用测试设备验证。模型生成成功不等于消息已送达。</p><button id="reset">新建测试会话</button><div id="chat" aria-live="polite"></div><form id="form"><label for="text">求职者消息</label><input id="text" required maxlength="2000" placeholder="例如：这个岗位工资和班次是什么？"><button id="send">测试生成回复</button></form></main>
<script type="module" src="/dify-connection-script"></script></html>
