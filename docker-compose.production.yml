services:
  app:
    build: .
    image: city-recruitment-mock-service:latest
    container_name: city-recruitment-app
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      REA_HOST: 0.0.0.0
      REA_PORT: 4222
      REA_DATABASE_PATH: /data/app.sqlite
      # 前端用 public/ 下的 Vue 版本（旧界面 + theme/ 注入层）。
      # 2026-11-14 客户明确要求：要旧版布局样式，功能保持现状。
      # src/config.ts 本来就以 public 为默认；这里显式写死，不依赖 env 覆盖。
      # React 产物仍随镜像构建（frontend/dist），需要时把这一行改回
      # /app/frontend/dist 即可切回，不用重新构建。
      # 新后台前端（Vue3 有源码版）：/app/frontend-vue/dist，见 Dockerfile 构建段。
      # 旧 public/ 编译版保留在镜像里但不再服务（2026-11-18 切换）。
      REA_FRONTEND_DIR: /app/frontend-vue/dist
      # 走知识库链路。534 条存量数据已经从易歪歪备份导进 PostgreSQL。
      REA_DIFY_PROVIDER: kb
      REA_KB_API_URL: http://city-recruitment-api:8090
      # Windows 客户端实际连接 systemd 的 8090；配置发布不能投到内部的另一份库。
      REA_BRAIN_URL: http://119.91.113.100:8090
      REA_KB_SERVICE_TOKEN_FILE: /run/kb/service-token
    ports:
      - "4222:4222"
    volumes:
      - ./data:/data
      # 服务间令牌：Python 启动时生成写入，这里只读
      - kb-token:/run/kb
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4222/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: city-recruitment-backend:latest
    container_name: city-recruitment-api
    restart: unless-stopped
    init: true
    env_file:
      - .env.api
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8090
    # 不映射宿主端口：API 只被同一 compose 网络内的服务调用。
    # 映射会让重部署时撞上 "address already in use"，而外部并不需要直连它。
    networks:
      - default
      - postgres
    read_only: true
    volumes:
      # 服务间令牌：启动时生成写入这里，Node 侧读同一个卷
      - kb-token:/run/kb
      # install_id 落在 /app/data/instance.json。根文件系统只读，不挂这个卷
      # 启动就会 OSError: [Errno 30] Read-only file system 直接退出（线上已踩）。
      # 用命名卷而非 tmpfs：install_id 必须跨重启保持同一个值。
      - api-data:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz').read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  postgres:
    external: true
    name: postgres_default

volumes:
  kb-token:
    driver: local
  # Python 侧 /app/data（install_id）。命名卷而非 tmpfs：值必须跨重启不变。
  api-data:
    driver: local
