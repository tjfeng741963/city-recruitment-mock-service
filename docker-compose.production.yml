services:
  app:
    build: .
    image: city-recruitment-mock-service:latest
    container_name: city-recruitment-app
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      REA_HOST: 0.0.0.0
      REA_PORT: 4222
      REA_DATABASE_PATH: /data/app.sqlite
      # 走知识库链路。534 条存量数据已经从易歪歪备份导进 PostgreSQL。
      REA_DIFY_PROVIDER: kb
      REA_KB_API_URL: http://city-recruitment-api:8090
      REA_KB_SERVICE_TOKEN_FILE: /run/kb/service-token
    ports:
      - "4222:4222"
    volumes:
      - ./data:/data
      # 服务间令牌：Python 启动时生成写入，这里只读
      - kb-token:/run/kb
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4222/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: city-recruitment-backend:latest
    container_name: city-recruitment-api
    restart: unless-stopped
    init: true
    env_file:
      - .env.api
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8090
    # 不映射宿主端口：API 只被同一 compose 网络内的服务调用。
    # 映射会让重部署时撞上 "address already in use"，而外部并不需要直连它。
    networks:
      - default
      - postgres
    read_only: true
    volumes:
      # 服务间令牌：启动时生成写入这里，Node 侧读同一个卷
      - kb-token:/run/kb
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz').read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  postgres:
    external: true
    name: postgres_default

volumes:
  kb-token:
    driver: local
