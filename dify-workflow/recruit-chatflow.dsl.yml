ages/202610/2dcc542e-56e9-4565-a3c1-fc8c9d550d0f-20261012042908.jpg）\n\n[工作环境]:\n###独立个人岗位（非流水线，一人一岗），岗位可自选，面试可以看车间的，不用穿无尘服（普通静电衣），车间有空调，全部坐班，不用看显微镜（测试岗位需要看电脑小屏幕，不用看显微镜，对眼睛无伤害），加班不自愿，必须统一服从厂里安排，可以带手机（里面管的不严 除了刚开始入职的时候不行 跟班组长熟悉后可以带进去 班组长不会管），不能带耳机上班，发薪首选招商银行（没有的话厂里会统一开工作证明给你到附近招商银行办理，或者用其他四大行），主要生产（光纤，数据线，转接器等电子产品），少数名族\n：维吾尔族，彝族，回族，藏族，蒙古族（彝族女孩子可以安排面试，男生暂时安排不了 没有名额！）有深圳三个月内体检报告可以不用体检（体检项目：心电 血常规 血压 等常规体检项目 没有体检报告的话需自费体检 80左右一个人 做满一个月厂里有报销 ）宿舍在园区旁边（走路上下班8分钟内可以到）自己就是厂区人事、面试官（我的身份是厂区面试官，自己就在厂区上班，面试需要找我，我还负责面试），正式工（直招正式工，不是派遣工，和工厂直签合同，不走第三方），预支工资（正式工不能预支工资），五险一金（不可以不买，必须要买），实习生不行（因为必须要买五险一金，实习生无法实习，也无法签三方协议）\n\n[工衣问题]:\n###普通静电衣，不用穿无尘服\n\n[体检费问题]:\n###体检费80元，自费体检，做满一个月有报销 \n\n[行李问题]:\n###入职当天才能安排宿舍，面试当天安排不了宿舍，需自行在外面住一晚\n\n[面试通知模板]:\n###⚠️ 报名成功，请提前做好面试准备，前往我司面试\n\n面试日期：\n\n【面试时间】：\n13:30-14:00，请勿迟到\n\n【交通路线】\n公交M173路：泰嘉乐站\n地铁六号线：长圳站下\n打车导航至：泰嘉乐\n\n【面试须知】\n请携带好本人身份证件\n\n💗时间变动请提前联系！\n###中午13:30左右到 切勿超过14:00 控制好过来的时间 到了之后打微信电话给我 我告诉你办公室怎么走 面试带好身份证原件 不要迟到哈 \n\n[面试指引]:\n###我跟你讲一下，待会面试跟紧流程，有什么不懂的给我发说，我这边帮你处理（我们是当天入职当天分配宿舍的）。那就祝您面试顺利～\n\n[报名表单]:\n###麻烦填一下报名信息，好了发给我哈~（姓名和电话填一下就行）\n名字：\n年龄：\n电话：\n面试入职日期：\n\n[岗位问题]:\n###独立个人岗位（非流水线，一人一岗），是否随机安排岗位（岗位自选），面试是否可以看车间（可以看车间）\n\n\n==============================\n[岗位7: 普工，打包--深圳集合点]\n==============================\n[岗位名称]: 普工，打包--深圳集合点\n[性别要求]: 不限\n[年龄要求]: 16-45周岁\n[可面试星期]: 周一、周二、周三、周四、周五\n[健康证要求]: 体检80，自费体检！做满一个月有报销\n[城市]: 深圳\n[区县]: 龙华\n[住宿要求]: 仅住宿\n[门店/厂名]: 深圳华创达\n[门店/厂区地址]: ###华创达科技园(广东省深圳市龙华区观澜街道大富路5号) & 22.736594,114.025102###\n[门店/厂区经纬度]: 22.736594,114.025102\n[面试时间]: 10:00-11:30\n\n--- 面试点1:  ---\n\n[招聘工种]:\n###正式工，临时工，独立个人岗位，非流水线\n\n[招聘要求]:\n###招聘要求：\n1.年龄：16-45岁，男女不限\n2.身体健康，小面积纹身可以\n3.有案底不行\n\n看下都符合吗\n\n[薪资详情]:\n###正式工：基本工资2700/月+包吃住+加班费（工作日23.28/小时，周末31.03/小时，节假日46.55/小时），岗位奖励800-1000+绩效奖500+工龄补贴500+五险一金，综合薪资6000-7500元 \n\n临时工：22/小时每月保底260-320个工时，综合薪资6200-6800\n\n每个月15号发薪\n\n年龄18-45岁，男女不限 （只接受要住宿的，外宿的暂时不安排，入职满后可申请外宿）\n\n二、工作内容：\n电子产品配件，组装，打包，包装，贴标签等\n\n三、吃住方面：\n包吃住，免费豪华住宿4-6人/间，空调，热水器，洗衣机，线wife，园区内饭堂。\n\n四、上班时间：\n8-8 长白班 中间休息2小时