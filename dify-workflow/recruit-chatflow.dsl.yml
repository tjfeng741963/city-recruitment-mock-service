n\n四、上班时间：\n8-8 长白班 中间休息2小时 月休四天 坐班为主 空调车间\n\n二、工作内容：\n电子产品配件（蓝牙耳机，数据线，转接器等），组装，打包，包装，贴标签等\n\n三、吃住方面：\n免费豪华住宿4-6人/间，空调，热水器，洗衣机，线wife，园区内饭堂。\n\n四、上班时间：\n长白班上午8:15-12:00下午13:15-17:30 加班18:00-21:00 月休四天 坐班为主 空调车间 超八小时算加班\n\n[薪资简述]:\n###正式工：基本工资2700/月+餐补200/月+加班费（工作日23.28/小时，周末31.03/小时，节假日46.55/小时）岗位奖励800-1000+绩效奖500+工龄补贴500+五险一金，综合薪资6000-7500元 \n\n临时工：22/小时每月保底260-320个工时，综合薪资6200-6800\n\n正式工不能预支工资，临时工每周可以预支工资\n\n[吃住情况]:\n###免费包吃住，住宿水电平摊，宿舍在园区旁边（走路上下班）\n\n\n\n[社保情况]:\n###正式工入职缴纳五险一金，临时工不买五险一金\n\n[班次问题]:\n###目前都是长白班的\n\n[工作时间]:\n###上午8:15-12:00下午13:15-17:30 加班18:00-20:00  超八小时算加班\n\n[宿舍环境]:\n###图片（https://tutu-guangzhou.oss-cn-beijing.aliyuncs.com/city-config-images/202610/a0ce1b8118af2b2fad19b2e7a1bb6a1a-20261016094033.jpg）\n\n[工作环境]:\n###独立个人岗位（非流水线，一人一岗），岗位可自选\n面试可以看车间的，不用穿无尘服（普通静电衣），车间有空调，全部坐班，不用看显微镜（测试岗位需要看电脑小屏幕，不用看显微镜，对眼睛无伤害）\n\n[工衣问题]:\n###普通静电衣，不用穿无尘服\n\n[体检费问题]:\n###体检费80元，自费体检，做满一个月有报销 \n\n[行李问题]:\n###面试当天安排宿舍，3-7天新人阶段必须要住宿，外宿不安排面试，不接受外宿！必须要带行李过来才能安排面试 \n为了方便统一管理新人入职培训都是要住宿的，过了新人阶段后可申请外宿\n\n[面试通知模板]:\n###⚠️ 报名成功，请提前做好面试准备，前往我司面试\n\n面试日期：\n\n【面试时间】：\n10:00-11:30，请勿迟到\n\n【面试须知】\n请携带好本人身份证件+个人行李（不带行李不安排面试，不接受外宿人员预留岗位名额）\n\n💗时间变动请提前联系！\n###上午10:00左右到 切勿超过11:30 控制好过来的时间 到了之后打微信电话给我 我告诉你办公室怎么走 面试带好身份证原件 不要迟到哈 \n\n[面试指引]:\n###我跟你讲一下，待会面试跟紧流程，有什么不懂的给我发说，我这边帮你处理（我们是当天入职当天分配宿舍的）。那就祝您面试顺利～\n\n[报名表单]:\n###麻烦填一下报名信息，好了发给我哈~（姓名和电话填一下就行）\n名字：\n年龄：\n电话：\n面试入职日期：\n\n[岗位问题]:\n###独立个人岗位（非流水线，一人一岗），是否随机安排岗位（岗位自选），面试是否可以看车间（可以看车间）\n\n\n[备注]:\n你们是劳务还是厂里直招的（我们不是劳务，也不是第三方，入职都是和我们工厂直接签合同的）\n正式工是（直招正式工，不是派遣工，和工厂直签合同，不走第三方）\n加班不自愿，必须统一服从厂里安排\n有深圳三个月内体检报告可以不用体检（体检项目：心电 血常规 血压 等常规体检项目 没有体检报告的话需自费体检 80左右一个人 做满一个月厂里有报销 ）\n发薪首选四大行（没有的话厂里会统一开工作证明给你到附近银行办理）\n可以带手机（里面管的不严 除了刚开始入职的时候不行 跟班组长熟悉后可以带进去 班组长不会管），不能带耳机上班\n加班不自愿，必须统一服从厂里安排\n为什么要带行李（都是要先带行李过来预留好位置的，最近找工作人的很多，因为我们这边是长白班的，应聘人员很多，为了保证优先给那些真正想上班的带行李过来的人安排工作，我们这边都是优先给带行李的员工预留位置，没行李一般是按不住宿处理，预留不了位置）\n\n==============================\n[岗位8: 普工，组装，打包，扫描，贴码]\n==============================\n[岗位名称]: 普工，组装，打包，扫描，贴码\n[性别要求]: 不限\n[年龄要求]: 18-50岁\n[可面试星