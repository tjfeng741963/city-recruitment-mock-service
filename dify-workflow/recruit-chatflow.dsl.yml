aw)\n    new_history = history + f\"应聘者：{query}\\n回复：{reply}\\n\\n\"\n\n    return {\n        \"flow_step_for_branch\": state.get(\"flow_step\", 1),\n        \"history\": new_history,\n        \"hualin_state\": json.dumps(state, ensure_ascii=False),\n        \"reply\": reply,\n    }",
