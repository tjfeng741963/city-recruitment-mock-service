.get(\"seeker_gender\", \"\")\n\n    now = datetime.datetime.now()\n    weekdays = [\"周一\", \"周二\", \"周三\", \"周四\", \"周五\", \"周六\", \"周日\"]\n    date_lines = [\"[未来7天日期对照]\"]\n    for offset in range(7):\n        day = now + datetime.timedelta(days=offset)\n        label = [\"今天\", \"明天\", \"后天\", \"3天后\", \"4天后\", \"5天后\", \"6天后\"][offset]\n        date_lines.append(f\"{label}= {day.strftime('%Y-%m-%d')}({weekdays[day.weekday()]})\")\n\n    header = \"\\n\".join(date_lines)\n    header += \"\\n\\n[招聘城市列表]\\n\" + CITY_LIST\n    header += \"\\n\\n[城市区县映射]\\n\" + \"\\n\".join(\n        f\"{c}: {'、'.join(ds)}\" for c, ds in DISTRICT_MAP.items()\n    )\n\n    missing = []\n    if not age:\n        missing.append(\"年龄\")\n    if not gender:\n        missing.append(\"性别\")\n\n    if not city:\n        availability = \"[可推厂区]（信息未齐：缺城市，禁止匹配，先追问缺失项）\"\n    elif missing:\n        availability = \"[可推厂区]（信息未齐：缺\" + \"或\".join(missing) + \"，禁止匹配，先追问缺失项）\"\n    else:\n        same_city = [b for b in FACTORY_DATA.split(\"\\n\\n\") if f\"[城市]: {city}\" in b]\n        names = \"、\".join(\n            line.split(\": \", 1)[1]\n            for block in same_city\n            for line in block.split(\"\\n\")\n            if line.startswith(\"[门店/厂名]\")\n        )\n        availability = f\"[同城厂区]求职者在{city}{district}，本市在招厂区：{names}\"\n\n    city_data_prompt = \"\\n\\n\".join([availability, header, \"=\" * 30, FACTORY_DATA])\n\n    return {\n        \"city_data_prompt\": city_data_prompt,\n        \"city_list_desc\": CITY_LIST,\n        \"knowledge_prompt\": \"\",\n        \"flow4_ask_state\": \"\",\n        \"flow_step\": flow_step,\n        \"hualin_state\": json.dumps(state, ensure_ascii=False),\n    }",
