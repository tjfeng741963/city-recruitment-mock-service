# 服务端（中心部署版）：postgres + backend + nginx
#
# 用法：在 deploy/server 目录执行
#   cp .env.example .env   # 或直接跑 ./install.sh 自动生成密钥
#   docker compose up -d --build
#
# 端口约定：
#   80（可改 HTTP_PORT） -> nginx，对外唯一入口
#   8090              -> backend，只绑 127.0.0.1，不对公网开放

name: city-recruitment

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recruit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置，请先运行 install.sh 或手工创建 .env}
      POSTGRES_DB: ${POSTGRES_DB:-city_recruitment}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-recruit} -d ${POSTGRES_DB:-city_recruitment}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  backend:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.org/simple}
    image: city-recruitment-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 连接串在这里拼，避免 .env 里密码出现两份；environment 优先级高于 env_file
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-recruit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-city_recruitment}
      TZ: Asia/Shanghai
    ports:
      # 只绑本机回环，外部一律经 nginx
      - "127.0.0.1:8090:8090"
    volumes:
      # runtime 数据（data/instance.json 等），容器重建不丢
      - appdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz').read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

volumes:
  pgdata:
  appdata:

networks:
  internal:
    driver: bridge
