# 城市招聘后端 · nginx 反向代理
#
# 挂载位置：/etc/nginx/nginx.conf（整份配置，不是 conf.d 片段）
#
# 约定：
#   - 不写死域名，server_name _; 用 IP 也能访问
#   - 唯一对外端口 80；backend:8090 只在 compose 内网可达
#   - 看板页面 /api/v1/leads/board 是空壳 HTML（不含名单），可公开
#   - 看板数据 /api/v1/leads/board/data 需要 JWT，由后端校验，nginx 不做鉴权
#
# 为什么用变量 $backend_host 而不是 upstream 块：
#   nginx 的 upstream 只在启动时解析一次域名。升级时 backend 容器被重建、
#   IP 会变，而 nginx 没变不会被重建，于是静态 upstream 会一直打到旧 IP → 502。
#   走 Docker 内置 DNS(127.0.0.11) +变量，每次请求重新解析，升级无感。
#   等价于 proxy_pass http://backend:8090;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    # 大模型/线索接口偶尔有较大请求体，20m 足够
    client_max_body_size 20m;

    # Docker 内置 DNS：让 backend 容器重建后自动指向新 IP
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WebSocket 升级用：/ws 需要
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       80 default_server;
        server_name  _;

        set $backend_host "backend:8090";

        # ── 健康检查（给 install.sh / 外部探活用，不写日志）──────────
        location = /healthz {
            access_log off;
            proxy_pass http://$backend_host/healthz;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 3s;
            proxy_read_timeout    5s;
        }

        # ── 看板页面：公开（页面本身不含任何数据）────────────────────
        location = /api/v1/leads/board {
            proxy_pass http://$backend_host/api/v1/leads/board;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── 实时推送 WebSocket：/ws?token=<JWT> ──────────────────────
        location /ws {
            proxy_pass http://$backend_host/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # ── 其余接口：全部转给后端，鉴权由 FastAPI 负责 ───────────────
        location / {
            proxy_pass http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 看板是接口直连刷新，关掉缓冲避免数据滞后
            proxy_buffering off;
            proxy_request_buffering off;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            # 设备心跳 / agent ingest 都是短请求；LLM 组织语言放宽到 120s
            proxy_connect_timeout 10s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;
        }
    }
}
