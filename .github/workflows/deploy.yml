name: test-and-deploy

on:
  # Any branch push runs the tests so feature branches get CI feedback.
  # Deployment stays main-only through the `deploy` job condition below.
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || github.ref == 'refs/heads/main' && 'deploy-production' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Typecheck backend
        run: npx tsc --noEmit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python and dependencies
        run: |
          # ubuntu-latest 已切到 24.04 (noble)，apt 源里没有 python3.11，
          # 只能用 setup-python 装。项目 package = false，装依赖不装自身。
          cd backend
          python -m pip install --upgrade pip uv
          uv pip install --system -r pyproject.toml pytest pytest-asyncio

      - name: Run Node tests
        run: npx vitest run --testTimeout=20000

      - name: Run Python tests
        run: pytest backend/tests/

      - name: Run isolated HTTP acceptance
        run: python scripts/acceptance-smoke.py

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key; update if the server is rebuilt.
          echo "$SSH_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPy3qq+xavuOjfLcMRmtHf28ydRtIxOAnBnijIwpRQ3h" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            sh -s -- "$GITHUB_SHA" <<'REMOTE'
          set -eu
          revision=$1
          case "$revision" in ''|*[!0-9a-f]*) exit 2;; esac
          cd /srv/apps/city-recruitment-mock-service/source
          git fetch origin main
          git checkout --detach "$revision"
          stamp=$(date +%Y%m%d-%H%M%S)
          cp -p .env.production ".env.production.pre-$revision-$stamp"
          # 备份用 VACUUM INTO 并校验表数：之前用 node:sqlite 的 backup() 产出过
          # 只有文件头、0 页的空壳，而 PRAGMA integrity_check 对空库仍返回 ok，
          # 部署脚本据此以为备份成功。现在用独立脚本，校验不过直接让部署失败。
          bak="data/app.sqlite.pre-$revision-$stamp.bak"
          docker run --rm -v "$PWD/data:/data" -v "$PWD/scripts:/scripts:ro" \
            node:22.21.1-bookworm-slim \
            node /scripts/backup-sqlite.mjs /data/app.sqlite "/data/app.sqlite.pre-$revision-$stamp.bak"
          docker compose -f docker-compose.production.yml build
          # 容器名固定（container_name），但历史上有人手工 docker run 起过同名容器、
          # 没有 compose 标签：compose 发现名字被占又不认作自己的，直接报
          # "container name is already in use" 让整个部署失败（11-07 即如此）。
          # 只清理「同名但不属于本项目」的容器，本项目的交给 compose 重建。
          for name in city-recruitment-app city-recruitment-api; do
            if docker inspect "$name" >/dev/null 2>&1; then
              owner=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$name" 2>/dev/null || true)
              if [ -z "$owner" ] || [ "$owner" != "source" ]; then
                echo "removing stale container $name (compose project: '${owner:-none}')" >&2
                docker rm -f "$name" >/dev/null
              fi
            fi
          done
          # kb-token 卷若由旧镜像建成 root 属主，Python 的 appuser 写不进令牌，
          # Node 调知识库就 401，自动回复整条链断掉（11-07 部署后实测如此）。
          # 镜像里 /run/kb 已属 appuser，这里只在卷确实是 root 时才改，幂等。
          docker run --rm --user root --entrypoint sh \
            -v source_kb-token:/run/kb city-recruitment-backend:latest \
            -c '[ "$(stat -c %u /run/kb)" = "1000" ] || chown 1000:1000 /run/kb'
          docker compose -f docker-compose.production.yml up -d --no-build --remove-orphans
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:4222/login; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "health check failed: /login did not respond within 60s" >&2
              docker compose -f docker-compose.production.yml logs --tail 80 app >&2
              exit 1
            fi
            sleep 2
          done
          # Python API 不映射宿主端口，健康检查读容器自身的 health 状态。
          # 起得比 Node 慢（建表 + 种子），给它独立的 90s 窗口。
          for i in $(seq 1 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' city-recruitment-api 2>/dev/null || echo missing)
            if [ "$status" = "healthy" ]; then
              git log -1 --oneline
              exit 0
            fi
            if [ "$i" -eq 45 ]; then
              echo "health check failed: api not healthy within 90s (status=$status)" >&2
              docker compose -f docker-compose.production.yml logs --tail 80 api >&2
              exit 1
            fi
            sleep 2
          done
          REMOTE
