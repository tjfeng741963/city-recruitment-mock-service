name: test-and-deploy

on:
  # Any branch push runs the tests so feature branches get CI feedback.
  # Deployment stays main-only through the `deploy` job condition below.
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || github.ref == 'refs/heads/main' && 'deploy-production' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    env:
      # Python's Windows runner defaults to a legacy code page; the test suite
      # intentionally exercises Chinese replies and must emit them as UTF-8.
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        run: npm run build

      - name: Typecheck backend
        run: npx tsc --noEmit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python and dependencies
        run: |
          # ubuntu-latest 已切到 24.04 (noble)，apt 源里没有 python3.11，
          # 只能用 setup-python 装。项目 package = false，装依赖不装自身。
          cd backend
          python -m pip install --upgrade pip uv
          uv pip install --system -r pyproject.toml pytest pytest-asyncio

      - name: Run Node tests
        run: npx vitest run --testTimeout=20000

      - name: Run Python tests
        run: pytest backend/tests/

      - name: Run isolated HTTP acceptance
        run: python scripts/acceptance-smoke.py

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key; update if the server is rebuilt.
          echo "$SSH_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPy3qq+xavuOjfLcMRmtHf28ydRtIxOAnBnijIwpRQ3h" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            sh -s -- "$GITHUB_SHA" <<'REMOTE'
          set -eu
          revision=$1
          case "$revision" in ''|*[!0-9a-f]*) exit 2;; esac
          cd /srv/apps/city-recruitment-mock-service/source
          git fetch origin main
          # 服务器是测试环境、代码只应来自 git，所以这里直接丢弃本地改动。
          # 2026-11-14 之前用 git checkout --detach，一旦服务器上有人手工改过
          # 跟踪文件或留下未跟踪文件，checkout 会以 "would be overwritten" 中止，
          # 导致部署连续失败、线上一直跑旧镜像。
          #
          # clean 的 -e 必须列全所有不进 git 的运行数据（.gitignore 里是 .env*）：
          #   .env.production / .env.api  服务配置，删了容器起不来
          #   data / node_modules         数据与构建缓存
          # 2026-11-14 曾漏掉 .env.api，-x 直接把它删了，部署挂在
          # "env file .../.env.api not found"。现在用 .env* 通配兜住全部。
          #
          # 先修属主：历史上 root 身份在宿主机上操作过（sudo git / root 容器写过
          # bind mount），public/ 等路径归 root，deploy 用户无写权限，
          # git reset 会以 "unable to unlink old 'public/index.html':
          # Permission denied" 失败。deploy 在 docker 组里，借 root 容器改回来。
          # data/ 与 node_modules 跳过：前者是应用用户的 SQLite 与备份，
          # 改成 deploy 属主会让应用失去写权限；后者是构建缓存。
          docker run --rm --user root --entrypoint sh -v "$PWD:/src" \
            -e OWNER="$(id -u):$(id -g)" node:22.21.1-bookworm-slim \
            -c 'cd /src && for f in * .[!.]*; do case "$f" in data|node_modules|.|..) continue;; esac; chown -R "$OWNER" "$f" 2>/dev/null || true; done'
          git reset --hard HEAD >/dev/null 2>&1 || true
          # -e 用 .env* 通配：.gitignore 里就是这一条，`.env.production`、`.env.api`
          # 都是服务启动必需（漏一个 compose 就报 "env file not found"）。
          git clean -fdx -e '.env*' -e data -e node_modules >/dev/null 2>&1 || true
          git checkout --detach "$revision"
          # 核对：清理后工作区必须干净，否则宁可报错也不要带脏代码去 build
          if [ -n "$(git status --porcelain)" ]; then
            echo "working tree still dirty after reset/clean:" >&2
            git status --porcelain >&2
            echo "hint: 上面列出的文件多半仍是 root 属主，手工 chown 后再部署" >&2
            exit 1
          fi
          echo "deploying revision: $(git rev-parse --short HEAD) $(git log -1 --format=%s)"
          # .env* 被误删时的自愈：2026-11-14 曾因 clean -x 删掉 .env.api，
          # compose 直接报 "env file ... not found" 让整个部署失败。
          # 旧容器还活着，它的 Config.Env 就是当时读进去的 APP_* 变量，
          # 直接读回来重建成文件即可。读不到就明确失败，不猜数据库密码。
          for envf in .env.production .env.api; do
            if [ ! -f "$envf" ]; then
              echo "WARN: $envf missing, trying to rebuild from running container" >&2
              case "$envf" in
                .env.api) cname=city-recruitment-api; prefix=APP_ ;;
                *)        cname=city-recruitment-app; prefix=REA_ ;;
              esac
              docker inspect "$cname" --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null \
                | grep -E "^${prefix}" > "$envf.tmp" || true
              if [ -s "$envf.tmp" ]; then
                mv "$envf.tmp" "$envf"
                chmod 600 "$envf"
                echo "rebuilt $envf ($(wc -l < "$envf") vars) from $cname" >&2
              else
                rm -f "$envf.tmp"
                echo "FATAL: $envf missing and no running $cname to rebuild from; restore it manually" >&2
                exit 1
              fi
            fi
          done
          stamp=$(date +%Y%m%d-%H%M%S)
          cp -p .env.production ".env.production.pre-$revision-$stamp"
          # 备份用 VACUUM INTO 并校验表数：之前用 node:sqlite 的 backup() 产出过
          # 只有文件头、0 页的空壳，而 PRAGMA integrity_check 对空库仍返回 ok，
          # 部署脚本据此以为备份成功。现在用独立脚本，校验不过直接让部署失败。
          bak="data/app.sqlite.pre-$revision-$stamp.bak"
          # data/ 归容器内应用用户（uid 1000）所有、权限 700，deploy 用户进不去，
          # 所以备份容器必须用 root 才能读到 app.sqlite。
          # 但产物会变成 root 属主，导致下次部署清理/轮转失败，
          # 因此备份完把它 chown 回 app.sqlite 的属主（不硬编码 uid，随实际而定）。
          docker run --rm -v "$PWD/data:/data" -v "$PWD/scripts:/scripts:ro" \
            node:22.21.1-bookworm-slim \
            node /scripts/backup-sqlite.mjs /data/app.sqlite "/data/app.sqlite.pre-$revision-$stamp.bak"
          # 用通配匹配刚生成的备份，不在 sh -c 里拼 $revision/$stamp——
          # 单引号会阻止外层展开，内层又没有这两个变量，拼出来是 pre--.bak。
          # 备份刚生成且文件名带 revision，通配只会命中它一个。
          # 没有命中就显式失败：宁可部署报错，也不要留下 root 属主的备份文件。
          docker run --rm -v "$PWD/data:/data" node:22.21.1-bookworm-slim \
            sh -c 'set -- /data/app.sqlite.pre-'"$revision"'*.bak
                   [ -e "$1" ] || { echo "backup file not found for $0" >&2; exit 1; }
                   chown --reference=/data/app.sqlite "$1"
                   echo "backup owner aligned: $(stat -c %U:%G "$1")"'
          docker compose -f docker-compose.production.yml build
          # 容器名固定（container_name），但历史上有人手工 docker run 起过同名容器、
          # 没有 compose 标签：compose 发现名字被占又不认作自己的，直接报
          # "container name is already in use" 让整个部署失败（11-07 即如此）。
          # 只清理「同名但不属于本项目」的容器，本项目的交给 compose 重建。
          for name in city-recruitment-app city-recruitment-api; do
            if docker inspect "$name" >/dev/null 2>&1; then
              owner=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$name" 2>/dev/null || true)
              if [ -z "$owner" ] || [ "$owner" != "source" ]; then
                echo "removing stale container $name (compose project: '${owner:-none}')" >&2
                docker rm -f "$name" >/dev/null
              fi
            fi
          done
          # kb-token 卷若由旧镜像建成 root 属主，Python 的 appuser 写不进令牌，
          # Node 调知识库就 401，自动回复整条链断掉（11-07 部署后实测如此）。
          # 镜像里 /run/kb 已属 appuser，这里只在卷确实是 root 时才改，幂等。
          docker run --rm --user root --entrypoint sh \
            -v source_kb-token:/run/kb city-recruitment-backend:latest \
            -c '[ "$(stat -c %u /run/kb)" = "1000" ] || chown 1000:1000 /run/kb'
          docker compose -f docker-compose.production.yml up -d --no-build --remove-orphans
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:4222/login; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "health check failed: /login did not respond within 60s" >&2
              docker compose -f docker-compose.production.yml logs --tail 80 app >&2
              exit 1
            fi
            sleep 2
          done
          # Python API 不映射宿主端口，健康检查读容器自身的 health 状态。
          # 起得比 Node 慢（建表 + 种子），给它独立的 90s 窗口。
          for i in $(seq 1 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' city-recruitment-api 2>/dev/null || echo missing)
            if [ "$status" = "healthy" ]; then
              git log -1 --oneline
              exit 0
            fi
            if [ "$i" -eq 45 ]; then
              echo "health check failed: api not healthy within 90s (status=$status)" >&2
              docker compose -f docker-compose.production.yml logs --tail 80 api >&2
              exit 1
            fi
            sleep 2
          done
          REMOTE
